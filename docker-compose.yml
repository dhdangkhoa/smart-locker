

services:
  # service database
  postgres-db:
    image: postgres:15-alpine
    container_name: project_db
    restart: always
    environment:
      POSTGRES_USER: admin_dev  
      POSTGRES_PASSWORD: smartlockerdb
      POSTGRES_DB: smartlockerdatabase
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  # service app 
  web-app:
    build: . 
    container_name: project_app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: DATABASE_URL = postgresql://admin_dev:smartlockerdb@localhost:5432/smartlockerdatabase
    depends_on:
      - postgres-db 

volumes:
  db_data: 